[project]
name = "todo-app"
version = "0.1.0"
description = "Modular In-Memory Todo CLI System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
]

[project.scripts]
todo = "todo_app.main:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"