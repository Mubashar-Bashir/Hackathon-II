# API Contracts: Time & Automation Feature

## 1. CLI Command Extensions

### 1.1 Enhanced Add Command
```
Endpoint: todo add [OPTIONS] TITLE
Method: CLI Command
Description: Add a new task with optional time automation features

Parameters:
  TITLE (required): The task title
  --description TEXT: Optional task description
  --priority TEXT: Task priority (low, medium, high) [default: medium]
  --due-date TEXT: Due date in ISO format (YYYY-MM-DDTHH:MM) or relative format
  --recurrence TEXT: Recurrence pattern (daily, weekly, monthly, none) [default: none]

Examples:
  todo add "Weekly meeting" --recurrence weekly --due-date "2025-01-06T10:00"
  todo add "Project deadline" --due-date "2025-01-15T23:59" --priority high
  todo add "Simple task" --description "Just a regular task"
```

### 1.2 Enhanced List Command
```
Endpoint: todo list [OPTIONS]
Method: CLI Command
Description: List all tasks with enhanced display for time automation features

Parameters:
  --show-overdue BOOLEAN: Show only overdue tasks [default: false]
  --show-due-soon BOOLEAN: Show tasks due in next 7 days [default: false]
  --show-recurring BOOLEAN: Show only recurring tasks [default: false]

Response Format:
  ID | Title | Status | Due Date | Recurrence | Priority
  ---|-------|--------|----------|------------|----------
  1  | Task 1| Done   | 2025-01-05| none      | medium
  2  | Task 2| Pending| 2025-01-06| weekly    | high
  3  | Task 3| Pending| -         | daily     | low

Visual Indicators:
  - Due dates displayed in color (red for overdue, yellow for due soon, green for future)
  - Recurrence patterns shown with icons/symbols
```

### 1.3 New Upcoming Tasks Command
```
Endpoint: todo upcoming [OPTIONS]
Method: CLI Command
Description: Show tasks due in the next specified number of days

Parameters:
  --days INTEGER: Number of days to look ahead [default: 7]

Response Format:
  Date | Tasks
  -----|-------
  2025-01-06 | - Meeting (due 10:00) [weekly]
  2025-01-07 | - Submit report (due 23:59)
  2025-01-08 | - Team sync (due 09:00) [daily]
```

### 1.4 Complete Command Enhancement
```
Endpoint: todo complete ID
Method: CLI Command
Description: Mark a task as complete, with special handling for recurring tasks

Behavior:
  - For non-recurring tasks: Mark as complete normally
  - For recurring tasks: Mark as complete AND create a new instance for the next occurrence
  - Update the original task's next_occurrence_date field

Response:
  - Success message for normal tasks
  - Special message for recurring tasks: "Task completed. Next occurrence scheduled for [date]"
```

## 2. Internal Service Contracts

### 2.1 TodoService Extensions

#### 2.1.1 create_task_with_schedule
```
Method: TodoService.create_task_with_schedule()
Parameters:
  - title: str
  - description: Optional[str]
  - priority: str
  - due_date: Optional[datetime]
  - recurrence_pattern: RecurrencePattern

Returns: Task

Validation:
  - If recurrence_pattern is not "none", ensure due_date is set or can be calculated
  - Generate appropriate next_occurrence_date if recurring
```

#### 2.1.2 get_upcoming_tasks
```
Method: TodoService.get_upcoming_tasks()
Parameters:
  - days: int (default 7)

Returns: List[Task]

Behavior:
  - Return tasks with due_date within the specified number of days
  - Exclude completed tasks
  - Sort by due_date ascending
```

#### 2.1.3 process_recurring_task_completion
```
Method: TodoService.process_recurring_task_completion()
Parameters:
  - task_id: str

Returns: Tuple[Task, Optional[Task]] (original task, new recurring instance)

Behavior:
  - Mark the original task as complete
  - Calculate next occurrence date based on recurrence pattern
  - Create new task with same properties but new due date
  - Update original task's next_occurrence_date
```

### 2.2 Scheduler Service Contracts

#### 2.2.1 check_due_tasks
```
Method: SchedulerService.check_due_tasks()
Parameters: None

Returns: List[Task]

Behavior:
  - Find all incomplete tasks with due_date before or equal to current time
  - Exclude tasks where reminder_sent is True
  - Mark these tasks for notification
```

#### 2.2.2 check_recurring_tasks
```
Method: SchedulerService.check_recurring_tasks()
Parameters: None

Returns: List[Task]

Behavior:
  - Find all completed recurring tasks
  - Identify tasks that need new instances created
  - Return tasks that need processing
```

### 2.3 Notification Service Contracts

#### 2.3.1 send_task_notification
```
Method: NotificationService.send_task_notification()
Parameters:
  - task: Task

Returns: bool (success/failure)

Behavior:
  - Send system notification for the specified task
  - Update task's reminder_sent field to True
  - Handle cross-platform notification differences
```

## 3. Data Storage Contracts

### 3.1 Task Repository Extensions
The repository interface remains the same, but the underlying data model now includes additional fields. All new fields are optional with appropriate defaults to maintain backward compatibility.