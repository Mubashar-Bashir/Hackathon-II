# Spec-Kit Configuration
version: 1.0
features:
  - name: todo-cli
    path: specs/001-todo-cli/
    enabled: true
  - name: mcp-server
    path: specs/002-mcp-server/
    enabled: true
  - name: monorepo-migration
    path: specs/003-monorepo-migration/
    enabled: true

workflow:
  specify: sp.specify
  plan: sp.plan
  tasks: sp.tasks
  implement: sp.implement

directories:
  specs: specs/
  history: .history/
  templates: .specify/templates/
  scripts: .specify/scripts/
  memory: .specify/memory/
