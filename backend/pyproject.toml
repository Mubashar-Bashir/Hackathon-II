[project]
name = "todo-app"
version = "0.1.0"
description = "Modular In-Memory Todo CLI System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pendulum>=3.0.0",
    "plyer>=2.1.0",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "sqlmodel>=0.0.8",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.0.3",
    "psycopg2-binary>=2.9.7",
    "openai>=1.0.0",
    "openai-agents>=0.6.0",
]

[project.scripts]
todo = "todo_app.main:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"